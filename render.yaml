services:
  - type: web
    name: archiwum-sprzedazy
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: APP_PASSWORD
        value: archiwum2025

